[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeno-assistant"
version = "0.1.0"
description = "ZENO — a local-first, honestly-documented personal intelligence agent skeleton."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ZENO Project" }]
dependencies = [
    "requests>=2.31",
    "psutil>=5.9",
    "reportlab>=4.0",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
webui = [
    "flask>=3.0",
]

[project.scripts]
zeno = "zeno.cli:main"
zeno-web = "zeno.webui:main"

[tool.setuptools.packages.find]
include = ["zeno*"]

[tool.setuptools.package-data]
zeno = ["webui_static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
