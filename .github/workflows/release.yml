name: Windows installer

# Runs on version tags (v0.1.1, ...) and from the Actions tab's "Run workflow"
# button. Manual runs get an automatic build-YYYYMMDD-HHMMSS tag, so there is
# always a tag to attach the installer to (same approach as Nova's workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Build the app with PyInstaller
        run: pyinstaller zeno.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build ZENO-Setup.exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" zeno_installer.iss'

      - name: Publish to a GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") { $tag = $env:GITHUB_REF_NAME }
          else { $tag = "build-$(Get-Date -Format 'yyyyMMdd-HHmmss')" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "installer_output/ZENO-Setup.exe" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag "installer_output/ZENO-Setup.exe" --title "ZENO $tag" --notes "Build from commit $env:GITHUB_SHA" --repo $env:GITHUB_REPOSITORY
          }
